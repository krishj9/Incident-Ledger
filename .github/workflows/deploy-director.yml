name: Deploy Director Portal to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'apps/director/**'
      - '.github/workflows/deploy-director.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci

      - name: Build Web App
        run: |
          npx expo export -p web
        working-directory: apps/director

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Deploy to Firebase Hosting
        run: |
          npx firebase-tools deploy --only hosting:director --project mybrightday-dev
